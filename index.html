<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Semáforo de Ruido</title>

  <style>
    :root {
      --base-blue: #1B4079;
      --mid-blue: #4D7C8A;
    }

    body {
      margin: 0;
      font-family: 'Liberation Sans', Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, var(--mid-blue), var(--base-blue));
      transition: background 0.25s ease;
      overflow: hidden;
    }

    /* ===== HERO ===== */

    .hero-wrap {
      display: flex;
      justify-content: center;
      margin: 12px 0 6px;
      padding: 8px 16px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(3.2rem, 6vw, 4.2rem);
      font-weight: 900;
      color: white;
      -webkit-text-stroke: 3px black;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
      margin: 10px 0;
    }

    .hero h2 {
      font-size: clamp(4rem, 8vw, 5.2rem);
      font-weight: 800;
      color: white;
      -webkit-text-stroke: 2px black;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
      margin: 8px 0;
    }

    .hero p {
      font-size: clamp(2.8rem, 6vw, 3.6rem);
      font-weight: 600;
      color: white;
      -webkit-text-stroke: 1.5px black;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
      margin: 6px 0;
    }

    /* ===== LAYOUT ===== */

    .container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90%;
      margin: 0 auto 40px auto;
      min-height: 620px;
    }

    /* ===== CARRUSEL ===== */

    .carrusel {
      position: absolute;
      left: 120px;
      top: 50%;
      transform: translateY(-50%);
      width: 650px;
      height: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .carrusel img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;

      opacity: 0;

      transition: opacity 1s ease;
    }

    .carrusel img.active {
      opacity: 1;
    }

    /* ===== BARRA ===== */

    .bar-container {
      position: absolute;
      right: 170px;
      top: 50%;
      transform: translateY(-50%);

      width: 90px;
      height: 700px;

      background: #eeeeee;

      border-radius: 22px;

      overflow: hidden;

      display: flex;
      align-items: flex-end;

      box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .bar {
      width: 100%;
      height: 0%;
      background: green;
      transition: height 0.1s linear,
        background 0.1s linear;
    }

    /* ===== IMAGEN CENTRAL ===== */

    .center {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #estadoImg {
      width: 630px;
      max-width: 90vw;
      height: auto;
    }
  </style>
</head>

<body>

  <!-- ===== HERO ===== -->

  <div class="hero-wrap">

    <div class="hero">

      <h1>Bienvenidas y bienvenidos al CRAI UR</h1>

      <h2>Calmómetro</h2>

      <p>Bájale al ruido, súbele a la concentración</p>

    </div>

  </div>

  <!-- ===== CONTENIDO ===== -->

  <div class="container">

    <!-- ===== CARRUSEL ===== -->

    <div class="carrusel" id="carruselBox">

      <img src="CanvaImgs/img1.png" class="active">
      <img src="CanvaImgs/img2.png">
      <img src="CanvaImgs/img3.png">
      <img src="CanvaImgs/img4.png">
      <img src="CanvaImgs/img5.png">
      <img src="CanvaImgs/img6.png">
      <img src="CanvaImgs/img7.png">
      <img src="CanvaImgs/img8.png">
      <img src="CanvaImgs/img9.png">
      <img src="CanvaImgs/img10.png">
      <img src="CanvaImgs/img11.png">
      <img src="CanvaImgs/img12.png">
      <img src="CanvaImgs/img13.png">
      <img src="CanvaImgs/img14.png">
      <img src="CanvaImgs/img15.png">
      <img src="CanvaImgs/img16.png">
      <img src="CanvaImgs/img17.png">
      <img src="CanvaImgs/img18.png">
      <img src="CanvaImgs/24h.png">

    </div>

    <!-- ===== BARRA ===== -->

    <div class="bar-container">

      <div id="bar" class="bar"></div>

    </div>

    <!-- ===== IMAGEN CENTRAL ===== -->

    <div class="center">

      <img
        id="estadoImg"
        src="Imagenes/verde.png"
        alt="Estado">

    </div>

  </div>

  <!-- ===== JAVASCRIPT ===== -->

  <script>

    /* =========================
       UTILIDADES
    ========================== */

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function mixRGB(c1, c2, t) {

      return [

        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t))

      ];
    }

    function rgbStr([r, g, b]) {
      return `rgb(${r}, ${g}, ${b})`;
    }

    const GREEN = [0, 255, 0];
    const YELLOW = [255, 255, 0];
    const RED = [255, 0, 0];

    const MID_BLUE = [77, 124, 138];
    const BASE_BLUE = [27, 64, 121];

    /* =========================
       PARPADEO
    ========================== */

    let blinkInterval = null;

    function startBlink() {

      if (blinkInterval) return;

      let toggle = false;

      blinkInterval = setInterval(() => {

        document.body.style.background =
          toggle
            ? 'black'
            : 'linear-gradient(to bottom right, red, darkred)';

        toggle = !toggle;

      }, 300);
    }

    function stopBlink() {

      if (blinkInterval) {

        clearInterval(blinkInterval);

        blinkInterval = null;
      }
    }

    /* =========================
       CARRUSEL
    ========================== */

    const imagenes =
      document.querySelectorAll("#carruselBox img");

    let idx = 0;

    setInterval(() => {

      imagenes[idx].classList.remove("active");

      idx = (idx + 1) % imagenes.length;

      imagenes[idx].classList.add("active");

    }, 30000);

    /* =========================
       MICRÓFONO
    ========================== */

    async function iniciarMicrofono() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        const AudioCtx =
          window.AudioContext ||
          window.webkitAudioContext;

        const audioContext = new AudioCtx();

        const source =
          audioContext.createMediaStreamSource(stream);

        const analyser =
          audioContext.createAnalyser();

        analyser.fftSize = 256;

        source.connect(analyser);

        const dataArray =
          new Uint8Array(analyser.frequencyBinCount);

        const barEl =
          document.getElementById("bar");

        const estadoImg =
          document.getElementById("estadoImg");

        function frame() {

          analyser.getByteFrequencyData(dataArray);

          let sum = 0;

          for (let i = 0; i < dataArray.length; i++) {

            sum += dataArray[i];
          }

          const avg = sum / dataArray.length;

          const sensitivity = 3;

          const volume = Math.min(
            100,
            (avg / 255) * 100 * sensitivity
          );

          /* ===== BARRA ===== */

          barEl.style.height = volume + "%";

          let color;

          if (volume <= 50) {

            color = mixRGB(
              GREEN,
              YELLOW,
              volume / 50
            );

          } else {

            color = mixRGB(
              YELLOW,
              RED,
              (volume - 50) / 50
            );
          }

          barEl.style.background = rgbStr(color);

          /* ===== FONDO ===== */

          if (!blinkInterval) {

            const bgMix = mixRGB(
              MID_BLUE,
              BASE_BLUE,
              volume / 100
            );

            const bgColor = rgbStr(bgMix);

            document.body.style.background =
              `linear-gradient(to bottom right, ${bgColor}, #1B4079)`;
          }

          /* ===== IMAGEN ===== */

          if (volume <= 40) {

            estadoImg.src = "Imagenes/verde.png";

            stopBlink();

          } else if (volume <= 70) {

            estadoImg.src = "Imagenes/amarillo.png";

            stopBlink();

          } else {

            estadoImg.src = "Imagenes/rojo.png";

            startBlink();
          }

          requestAnimationFrame(frame);
        }

        frame();

      } catch (err) {

        console.error(err);

        alert(
          "Error accediendo al micrófono:\n\n" +
          err.message
        );
      }
    }

    iniciarMicrofono();

  </script>

</body>

</html>
