<script>
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function mixRGB(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t)),
    ];
  }

  function rgbStr([r, g, b]) {
    return `rgb(${r}, ${g}, ${b})`;
  }

  const GREEN = [0, 255, 0];
  const YELLOW = [255, 255, 0];
  const RED = [255, 0, 0];
  const MID_BLUE = [77, 124, 138];
  const BASE_BLUE = [27, 64, 121];

  let blinkInterval = null;

  function startBlink() {

    if (blinkInterval) return;

    let toggle = false;

    blinkInterval = setInterval(() => {

      document.body.style.background = toggle
        ? 'black'
        : 'linear-gradient(to bottom right, red, darkred)';

      toggle = !toggle;

    }, 300);
  }

  function stopBlink() {

    if (blinkInterval) {

      clearInterval(blinkInterval);

      blinkInterval = null;
    }
  }

  /* =========================
     MICRÓFONO Y SEMÁFORO
  ========================== */

  (async () => {

    try {

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });

      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      const audioContext = new AudioCtx();

      const source = audioContext.createMediaStreamSource(stream);

      const analyser = audioContext.createAnalyser();

      analyser.fftSize = 256;

      source.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      const barEl = document.getElementById('bar');

      const estadoImg = document.getElementById('estadoImg');

      function frame() {

        analyser.getByteFrequencyData(dataArray);

        let sum = 0;

        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }

        const avg = sum / dataArray.length;

        const sensitivity = 2.2;

        const volume = Math.min(
          100,
          (avg / 255) * 100 * sensitivity
        );

        /* ===== Barra ===== */

        barEl.style.height = volume + '%';

        let color;

        if (volume <= 50) {

          color = mixRGB(
            GREEN,
            YELLOW,
            volume / 50
          );

        } else {

          color = mixRGB(
            YELLOW,
            RED,
            (volume - 50) / 50
          );
        }

        barEl.style.background = rgbStr(color);

        /* ===== Fondo ===== */

        if (!blinkInterval) {

          const bgMix = mixRGB(
            MID_BLUE,
            BASE_BLUE,
            volume / 100
          );

          const bgColor = rgbStr(bgMix);

          document.body.style.background =
            `linear-gradient(to bottom right, ${bgColor}, #1B4079)`;
        }

        /* ===== Estado ===== */

        if (volume <= 40) {

          if (!estadoImg.src.includes('verde.png')) {
            estadoImg.src = 'Imagenes/verde.png';
          }

          stopBlink();

        } else if (volume <= 70) {

          if (!estadoImg.src.includes('amarillo.png')) {
            estadoImg.src = 'Imagenes/amarillo.png';
          }

          stopBlink();

        } else {

          if (!estadoImg.src.includes('rojo.png')) {
            estadoImg.src = 'Imagenes/rojo.png';
          }

          startBlink();
        }

        requestAnimationFrame(frame);
      }

      frame();

    } catch (err) {

      alert(
        'Error accediendo al micrófono: '
        + err.name +
        ' - ' +
        err.message +
        '\n\n🔧 Revisa:\n'
        + '1. Que uses HTTPS\n'
        + '2. Que el micrófono esté permitido\n'
        + '3. Que no esté ocupado por otro programa.'
      );

      console.error(err);
    }

  })();

  /* =========================
        CARRUSEL
  ========================== */

  const imagenes = document.querySelectorAll("#carruselBox img");

  const carruselBox = document.getElementById("carruselBox");

  let idx = 0;

  setInterval(() => {

    /* quitar imagen actual */
    imagenes[idx].classList.remove("active");

    /* avanzar */
    idx = (idx + 1) % imagenes.length;

    /* activar nueva */
    imagenes[idx].classList.add("active");

    /* transparencia */
    const src = imagenes[idx].getAttribute("src");

    if (src.endsWith(".png")) {

      carruselBox.classList.add("transparent");

    } else {

      carruselBox.classList.remove("transparent");
    }

  }, 30000);
</script>
